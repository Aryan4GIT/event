<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t">
  <title id="t">Catch the stick game: sticks hang from a wooden frame and one drops into a player's hand</title>
  <rect width="1200" height="675" fill="#FFF4EC"/>
  <circle cx="160" cy="150" r="190" fill="#FFE1EE"/>
  <circle cx="1080" cy="560" r="230" fill="#FFE9D6"/>
  <rect y="600" width="1200" height="75" fill="#F7DCCB"/>
  <!-- bunting -->
  <path d="M0 40 Q600 120 1200 40" fill="none" stroke="#5A3707" stroke-width="3"/>
  <g fill="#FF2E90"><path d="M60 50 l40 6 -26 40z"/><path d="M300 74 l42 3 -24 42z"/><path d="M560 82 l42 0 -21 42z"/><path d="M820 76 l42 -3 -18 42z"/><path d="M1080 54 l40 -6 -14 40z"/></g>
  <g fill="#FFC400"><path d="M180 64 l42 5 -26 40z"/><path d="M430 80 l42 1 -22 42z"/><path d="M690 81 l42 -1 -20 42z"/><path d="M950 66 l42 -5 -16 41z"/></g>
  <!-- frame -->
  <rect x="360" y="560" width="480" height="44" rx="8" fill="#7A4A1E"/>
  <rect x="360" y="560" width="480" height="10" rx="5" fill="#9C6430"/>
  <rect x="392" y="150" width="34" height="414" rx="6" fill="#8B5524"/>
  <rect x="774" y="150" width="34" height="414" rx="6" fill="#8B5524"/>
  <rect x="360" y="120" width="480" height="44" rx="8" fill="#9C6430"/>
  <rect x="360" y="152" width="480" height="12" fill="#7A4A1E"/>
  <!-- clips -->
  <g fill="#2E1620"><rect x="458" y="164" width="18" height="16" rx="3"/><rect x="510" y="164" width="18" height="16" rx="3"/><rect x="562" y="164" width="18" height="16" rx="3"/><rect x="614" y="164" width="18" height="16" rx="3"/><rect x="666" y="164" width="18" height="16" rx="3"/><rect x="718" y="164" width="18" height="16" rx="3"/></g>
  <!-- hanging sticks -->
  <rect x="456" y="180" width="22" height="250" rx="11" fill="#FF2E90"/>
  <rect x="508" y="180" width="22" height="250" rx="11" fill="#FF8A00"/>
  <rect x="560" y="180" width="22" height="250" rx="11" fill="#FFC400"/>
  <rect x="664" y="180" width="22" height="250" rx="11" fill="#7B4BD6"/>
  <rect x="716" y="180" width="22" height="250" rx="11" fill="#2F80ED"/>
  <!-- the empty clip and the falling stick -->
  <g stroke="#10B5A6" stroke-width="5" stroke-linecap="round" opacity=".55"><path d="M612 196 v40"/><path d="M634 214 v40"/><path d="M590 226 v30"/></g>
  <rect x="612" y="262" width="22" height="250" rx="11" fill="#10B5A6"/>
  <!-- the hand -->
  <rect x="690" y="430" width="250" height="44" rx="22" fill="#2E1620"/>
  <rect x="640" y="420" width="74" height="62" rx="26" fill="#C98B5E"/>
  <g fill="#D99C6E" stroke="#B5774A" stroke-width="2">
    <rect x="596" y="420" width="62" height="16" rx="8"/>
    <rect x="592" y="438" width="66" height="16" rx="8"/>
    <rect x="594" y="456" width="64" height="16" rx="8"/>
    <rect x="600" y="474" width="56" height="14" rx="7"/>
  </g>
  <rect x="650" y="404" width="22" height="40" rx="11" fill="#D99C6E" stroke="#B5774A" stroke-width="2" transform="rotate(-28 661 424)"/>
  <!-- confetti -->
  <g fill="#FF2E90"><circle cx="250" cy="330" r="7"/><circle cx="960" cy="250" r="6"/><circle cx="1040" cy="380" r="5"/></g>
  <g fill="#FFC400"><circle cx="210" cy="460" r="6"/><circle cx="300" cy="230" r="5"/><circle cx="1000" cy="180" r="7"/></g>
</svg>
